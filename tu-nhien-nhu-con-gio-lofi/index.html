<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="description" content="Nghe Tự Nhiên Như Cơn Gió (Lofi Version) của Ns Bùi Công trên Spotify, Apple Music, YouTube Music.">
    <meta property="og:title" content="Tự Nhiên Như Cơn Gió (Lofi Version) — Ns Bùi Công">
    <meta property="og:description" content="Nhạc chữa lành · Tiếng mưa rơi cực chill để chạy deadline">
    <meta property="og:image" content="../cover-tu-nhien-nhu-con-gio-lofi.jpg">
    <meta property="og:type" content="music.song">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#090d1a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100dvh;
            background: #090d1a;
            overflow-x: hidden;
        }

        /* ── BACKGROUND ── */
        .bg {
            position: fixed; inset: 0; z-index: 0;
            background: url('../cover-tu-nhien-nhu-con-gio-lofi.jpg') center / cover no-repeat;
            filter: blur(28px) brightness(0.28) saturate(1.4);
            transform: scale(1.15);
            will-change: transform;
        }
        .bg-overlay {
            position: fixed; inset: 0; z-index: 1;
            background: linear-gradient(150deg, rgba(8,14,30,.86) 0%, rgba(6,10,22,.7) 50%, rgba(9,15,32,.9) 100%);
        }
        .orb {
            position: fixed; z-index: 2; pointer-events: none; border-radius: 50%;
            filter: blur(70px);
        }
        .orb1 { width: min(340px,70vw); height: min(340px,70vw); background: radial-gradient(circle,rgba(59,130,246,.2),transparent); top: -10%; left: -10%; animation: drift 12s ease-in-out infinite; }
        .orb2 { width: min(260px,55vw); height: min(260px,55vw); background: radial-gradient(circle,rgba(139,92,246,.16),transparent); bottom: -8%; right: -8%; animation: drift 15s ease-in-out infinite reverse; }
        @keyframes drift { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-15px,18px);} }

        /* ── LAYOUT ── */
        .page {
            position: relative; z-index: 10;
            min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        }
        @media (max-width: 479px) {
            .page { padding: 0 0 max(24px, env(safe-area-inset-bottom)); align-items: flex-start; }
            .card { border-radius: 0 0 20px 20px; }
        }

        /* ── CARD ── */
        .card {
            width: 100%; max-width: 420px;
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07) inset;
            animation: cardIn .8s cubic-bezier(.34,1.45,.64,1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(.93); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── HERO ── */
        .hero {
            background: rgba(8,16,36,.65);
            backdrop-filter: blur(22px) saturate(1.8);
            -webkit-backdrop-filter: blur(22px) saturate(1.8);
            border-bottom: 1px solid rgba(255,255,255,.07);
        }
        .hero-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px 0;
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 5px;
            min-height: 36px; padding: 0 8px;
            color: rgba(255,255,255,.6); font-size: .76rem;
            text-decoration: none; border-radius: 8px;
            transition: color .2s; -webkit-tap-highlight-color: transparent;
        }
        .back-btn:active, .back-btn:hover { color: #fff; }
        .back-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg,rgba(59,130,246,.9),rgba(37,99,235,.85));
            color: #fff; font-size: .56rem; font-weight: 700;
            letter-spacing: .14em; text-transform: uppercase;
            padding: 5px 12px; border-radius: 30px;
            box-shadow: 0 4px 14px rgba(59,130,246,.35);
        }
        .badge-dot { width: 5px; height: 5px; background: #fff; border-radius: 50%; animation: blink 1.6s infinite; }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }

        /* ── ARTWORK (16:9 for YouTube Thumbnail) ── */
        .art-full-wrap {
            position: relative;
            width: 100%; margin: 14px 0 0;
            animation: artPop .8s .1s cubic-bezier(.34,1.45,.64,1) both;
        }
        @keyframes artPop { from{opacity:0;transform:scale(.88);} to{opacity:1;transform:scale(1);} }
        .art-full {
            width: 100%; aspect-ratio: 16/9;
            object-fit: cover; object-position: center; display: block;
        }
        .art-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 35%, rgba(8,16,36,.94) 100%);
        }
        .art-glow {
            position: absolute; bottom: -1px; left: 0; right: 0; height: 40px;
            background: linear-gradient(to bottom, transparent, rgba(8,16,36,.98));
        }
        .art-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 14px 18px 18px; text-align: left;
        }

        @media (min-width: 480px) {
            .art-full-wrap { padding: 18px 20px 0; margin: 0; }
            .art-full { border-radius: 14px; box-shadow: 0 16px 50px rgba(0,0,0,.65); }
            .art-info { padding: 14px 20px 20px; }
        }

        .artist-row {
            display:flex;align-items:center;gap:8px;
            margin-bottom:5px;animation:fadeIn .7s .4s both;
        }
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
        .artist-ava {
            width:22px;height:22px;border-radius:50%;object-fit:cover;
            border:1.5px solid rgba(255,255,255,.25);
        }
        .artist-name-txt{color:rgba(255,255,255,.75);font-size:.78rem;font-weight:500}
        .song-title {
            color:#fff;font-size:clamp(1.18rem,5.2vw,1.42rem);
            font-weight:800;line-height:1.2;margin-bottom:3px;
            animation:fadeIn .7s .5s both;
        }
        .song-meta{color:rgba(255,255,255,.5);font-size:.74rem;animation:fadeIn .7s .6s both;}

        /* Version switch bar */
        .version-bar {
            display: flex; gap: 6px; padding: 12px 18px 4px;
            overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .v-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 5px 11px; border-radius: 20px; font-size: .68rem; font-weight: 600;
            text-decoration: none; white-space: nowrap;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.7); transition: all .2s;
        }
        .v-chip.active {
            background: rgba(59,130,246,0.22); border-color: rgba(59,130,246,0.5);
            color: #60a5fa;
        }
        .v-chip:hover:not(.active) { background: rgba(255,255,255,0.15); color: #fff; }

        /* ── WAVE ── */
        .wave { display: block; width: 100%; margin-bottom: -1px; }

        /* ── STORES ── */
        .stores { background: #f8f9fc; padding: 18px 18px 12px; }
        .stores-lbl {
            font-size: .6rem; font-weight: 700; letter-spacing: .14em;
            text-transform: uppercase; color: #7f8ba6; margin-bottom: 8px; padding-left: 2px;
        }

        .store-item {
            display: flex; align-items: center; justify-content: space-between;
            min-height: 52px; padding: 0 8px;
            border-radius: 12px; text-decoration: none;
            transition: background .15s; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            animation: slideIn .45s both;
        }
        .store-item:nth-child(1){animation-delay:.06s} .store-item:nth-child(2){animation-delay:.10s}
        .store-item:nth-child(3){animation-delay:.14s} .store-item:nth-child(4){animation-delay:.18s}
        @keyframes slideIn { from{opacity:0;transform:translateX(-10px);} to{opacity:1;transform:translateX(0);} }
        .store-item:active { background: rgba(59,130,246,.08); }
        @media (hover: hover) {
            .store-item:hover { background: rgba(59,130,246,.06); transform: translateX(3px); }
            .store-item:hover .play-lbl { background: linear-gradient(135deg,#2563eb,#3b82f6); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(59,130,246,.35); }
        }

        .logo-box { height: 36px; display: flex; align-items: center; gap: 9px; flex: 1; }
        .brand-icon { width: 30px; height: 30px; flex-shrink: 0; }
        .brand-name { font-size: .82rem; font-weight: 700; color: #162038; line-height: 1; white-space: nowrap; letter-spacing: -.01em; }

        .play-lbl {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 7px 14px; border-radius: 30px;
            border: 1.5px solid #dce2ee; background: #fff;
            font-family: 'Inter', sans-serif; font-size: .76rem; font-weight: 600;
            color: #3b4e72; white-space: nowrap;
            transition: background .15s, color .15s, border-color .15s, box-shadow .15s;
        }
        .play-lbl svg { flex-shrink: 0; }

        .sep { height: 1px; background: linear-gradient(to right,transparent,#e2e6f0,transparent); margin: 0 8px; }

        /* ── FOOTER CARD ── */
        .foot { background: #f8f9fc; padding: 4px 18px calc(16px + env(safe-area-inset-bottom,0)); }
        .share-btn {
            display: flex; align-items: center; justify-content: center; gap: 7px;
            width: 100%; min-height: 44px; border-radius: 12px;
            background: rgba(59,130,246,.08); border: 1px dashed rgba(59,130,246,.32);
            color: #2563eb; font-size: .8rem; font-weight: 600;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: background .15s;
            margin-bottom: 12px; -webkit-tap-highlight-color: transparent;
        }
        .share-btn:active { background: rgba(59,130,246,.14); }
        .foot-txt { font-size: .65rem; color: #9aa5be; letter-spacing: .08em; text-transform: uppercase; text-align: center; }
        .foot-txt a { color: #2563eb; text-decoration: none; font-weight: 600; }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: max(24px,env(safe-area-inset-bottom,24px)); left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #111; color: #fff; padding: 10px 22px;
            border-radius: 30px; font-size: .82rem; font-weight: 500;
            box-shadow: 0 8px 25px rgba(0,0,0,.4); z-index: 999;
            transition: transform .32s cubic-bezier(.34,1.45,.64,1), opacity .28s;
            opacity: 0; pointer-events: none; white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite">✅ Đã copy link!</div>

<script>
function shareThis() {
    const url = location.href, title = 'Tự Nhiên Như Cơn Gió (Lofi Version) — Ns Bùi Công';
    if (navigator.share) {
        navigator.share({ title, url }).catch(() => {});
    } else {
        navigator.clipboard.writeText(url).then(showToast).catch(() => {});
    }
}
function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
}
</script>
